{% extends "layouts/base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="stat-icon amber mx-auto mb-3" style="width: 72px; height: 72px; font-size: 2rem;">
      <i class="bi bi-exclamation-octagon"></i>
    </div>
    <h2 class="fw-bold mb-2">500 - Internal Server Error</h2>
    <p class="text-muted mb-4">Something went wrong while processing your request. Our engineering team has been notified.</p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary-enterprise">Return Home</a>
  </div>
</div>
{% endblock %}
